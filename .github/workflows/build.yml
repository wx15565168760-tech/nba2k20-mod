name: Build NBA2K20 Mod

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    # 用 Ubuntu (免费额度, 私有仓库也能用)。macOS runner 私有仓库要付费, 会永远卡 queued
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install clang
        run: |
          sudo apt-get update
          sudo apt-get install -y clang xz-utils curl

      - name: Download iOS 16.5 SDK
        run: |
          # theos/sdks 仓库里 SDK 是目录, 用 git sparse-checkout 只拉 iPhoneOS16.5.sdk
          cd /tmp
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git
          cd sdks
          git sparse-checkout set iPhoneOS16.5.sdk
          ls -la iPhoneOS16.5.sdk | head -10
          mkdir -p $HOME/ios-sdk
          cp -r iPhoneOS16.5.sdk $HOME/ios-sdk/

      - name: Cross-compile dylib (arm64 iOS)
        run: |
          SDK=$(ls -d $HOME/ios-sdk/*.sdk | head -1)
          echo "SDK=$SDK"
          ls "$SDK" | head -10
          clang -target arm64-apple-ios16.5 \
                -isysroot "$SDK" \
                -mios-version-min=14.0 \
                -fobjc-arc \
                -Wno-unused-variable \
                -dynamiclib \
                -fPIC \
                -framework UIKit \
                -framework Foundation \
                -o nba2k20mod.dylib \
                Tweak.m
          file nba2k20mod.dylib
          ls -lh nba2k20mod.dylib

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: nba2k20mod
          path: nba2k20mod.dylib
          if-no-files-found: error
