name: Build NBA2K20 Mod

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-13
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Theos
        run: |
          export THEOS=/opt/theos
          sudo mkdir -p $THEOS
          sudo chown -R $(whoami) $THEOS
          # 拉取 Theos (精简历史)
          git clone --recursive --depth 1 https://github.com/theos/theos.git $THEOS
          # 下载 iOS SDK 16.x (clang 需要 SDK 才能编 arm64 iOS 目标)
          mkdir -p $THEOS/sdks
          cd /tmp
          curl -L -o sdk.tar.xz https://github.com/theos/sdks/releases/download/iPhoneOS16.5/iPhoneOS16.5.sdk.tar.xz || \
          curl -L -o sdk.tar.xz https://github.com/theos/sdks/releases/download/iPhoneOS16.4/iPhoneOS16.4.sdk.tar.xz || \
          curl -L -o sdk.tar.xz https://github.com/theos/sdks/releases/download/iPhoneOS16.0/iPhoneOS16.0.sdk.tar.xz
          ls -lh /tmp/sdk.tar.xz
          tar -xJf /tmp/sdk.tar.xz -C $THEOS/sdks
          ls $THEOS/sdks

      - name: Build dylib
        run: |
          export THEOS=/opt/theos
          export PATH=$THEOS/bin:$PATH
          make clean || true
          make
          ls -lh .theos/_/usr/lib/*.dylib

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: nba2k20mod
          path: .theos/_/usr/lib/*.dylib
          if-no-files-found: error
