name: Build NBA2K20 Mod

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    # 用 Ubuntu runner。Theos 在 Linux 上需要 Swift 交叉工具链
    # (kabiroberai/swift-toolchain-linux, 含 iPhoneOS clang+ld64), 解压到 $THEOS/toolchain
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos (Linux, with Swift toolchain)
        uses: Randomblock1/theos-action@v1
        with:
          theos-dir: /opt/theos

      - name: Build with Theos
        run: |
          export THEOS=/opt/theos
          export PATH=$THEOS/bin:$PATH
          make clean || true
          make
          find .theos -name "*.dylib" -exec ls -lh {} \;

      - name: Install ldid (Linux prebuilt)
        run: |
          sudo mkdir -p /usr/local/bin
          sudo curl -L -o /usr/local/bin/ldid https://github.com/ProcursusTeam/ldid/releases/latest/download/ldid_linux_x86_64
          sudo chmod +x /usr/local/bin/ldid
          ldid -v 2>&1 | head -1 || echo "ldid installed"

      - name: Sign dylib with ldid (adhoc)
        run: |
          # iOS 15+ dyld 强制要求 dylib 有有效签名, 否则拒载 -> 主程序闪退
          # ldid -S 写入 adhoc 签名(空 entitlements), 生成 LC_CODE_SIGNATURE
          DYLIB=$(find .theos -name "*.dylib" | head -1)
          echo "dylib: $DYLIB"
          ldid -S "$DYLIB"
          echo "--- verify ---"
          ldid -e "$DYLIB"; echo "exit=$?"
          ls -lh "$DYLIB"

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: nba2k20mod
          path: .theos/obj/**/*.dylib
          if-no-files-found: error
