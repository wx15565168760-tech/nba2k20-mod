name: Build NBA2K20 Mod

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    # 用 Ubuntu runner。Theos 在 Linux 上需要 Swift 交叉工具链
    # (kabiroberai/swift-toolchain-linux, 含 iPhoneOS clang+ld64), 解压到 $THEOS/toolchain
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos (Linux, with Swift toolchain)
        uses: Randomblock1/theos-action@v1
        with:
          theos-dir: /opt/theos

      - name: Build with Theos
        run: |
          export THEOS=/opt/theos
          export PATH=$THEOS/bin:$PATH
          make clean || true
          make
          find .theos -name "*.dylib" -exec ls -lh {} \;

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: nba2k20mod
          path: |
            .theos/_/usr/lib/*.dylib
            nba2k20mod.dylib
          if-no-files-found: warn
